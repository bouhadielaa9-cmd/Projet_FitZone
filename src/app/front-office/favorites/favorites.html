<section class="container py-5">

  <h2 class="text-center mb-4">My Favorites</h2>
<section class="container py-5">

  <div class="d-flex justify-content-between mb-4">

    <a routerLink="/home" class="btn btn-outline-success">
      <i class="bi bi-house"></i>
      Back to Home
    </a>

    <a routerLink="/products" class="btn btn-outline-success">
      <i class="bi bi-arrow-left"></i>
      Back to Products
    </a>
  </div>

  <h2 class="text-center mb-4">My Favorites</h2>

  <!-- Le reste de ton code -->
</section>
  @if (produitsFavoris().length > 0) {

    <div class="row g-4">
      @for (p of produitsFavoris(); track p.id) {
        <div class="col-12 col-sm-6 col-lg-4 col-xl-3">
          <app-product-item [product]="p" />
        </div>
      }
    </div>

  } @else {

    <div class="text-center py-5">
      <i class="bi bi-heart fs-1"></i>
      <h4 class="mt-3">No favorites yet</h4>
      <p>Add products to your favorites to find them here.</p>
    </div>

  }

</section>
