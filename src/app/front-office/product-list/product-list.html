
<div class="products-section">
  <div class="container">
    <div class="products-navigation">
      <a routerLink="/home" class="nav-btn">
        <i class="bi bi-house"></i>
        Back to Home
      </a>

      <a routerLink="/favorites" class="nav-btn favorites-nav">
        <i class="bi bi-heart-fill"></i>
        Favorites
      </a>
    </div>

    <div class="products-header">
      <span class="section-subtitle">FIND YOUR FITNESS ESSENTIALS</span>
      <h1>Our <span>Products</span></h1>
      <p>Discover the right equipment to reach your fitness goals.</p>
      <div class="heading-line"></div>
    </div>
    <div class="search-container">

      <div class="search-box">
        <label for="category">
          <i class="bi bi-tag"></i>
          Product Category
        </label>

        <div class="input-group">
          <i class="bi bi-search"></i>
          <input
            id="category"
            type="text"
            placeholder="Enter category..."
            [ngModel]="category()"
            (ngModelChange)="category.set($event)">
        </div>
      </div>

      <div class="search-box">
        <label for="maxPrice">
          <i class="bi bi-currency-dollar"></i>
          Maximum Price (DT)
        </label>

        <div class="input-group">
          <i class="bi bi-wallet2"></i>
          <input
            id="maxPrice"
            type="number"
            min="0"
            placeholder="Enter maximum price..."
            [ngModel]="maxPrice()"
            (ngModelChange)="maxPrice.set($event)">
        </div>
      </div>

    </div>


    <div class="row g-4">

      @for (p of filteredProducts(); track p.id) {

        <div class="col-12 col-sm-6 col-lg-4 col-xl-3">
          <app-product-item [product]="p" />
        </div>

      } @empty {

        <div class="col-12">
          <div class="no-results">
            <div class="empty-icon">
              <i class="bi bi-search"></i>
            </div>

            <h4>No products found</h4>
            <p>Try changing your search criteria.</p>
          </div>
        </div>

      }

    </div>

  </div>
</div>
