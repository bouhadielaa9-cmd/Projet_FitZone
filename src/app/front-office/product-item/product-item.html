<div class="product-card">

  <div class="product-image">
    <img [src]="product().photo" [alt]="product().nom">
  </div>

  <div class="product-info">
    <h5>{{ product().nom }}</h5>

    <p>{{ product().description }}</p>

    <span class="product-price">
      {{ product().prix }} DT
    </span>
   <a [routerLink]="['/products', product().id]" class="details-btn">
  View Details
  <i class="bi bi-arrow-right"></i>
</a>
<button
  class="favorite-btn"
  (click)="toggleFavori()"
  [class.active]="isFavori()">

  <i [class]="isFavori()?'bi bi-heart-fill' : 'bi bi-heart'"></i>

</button>
  </div>

</div>
