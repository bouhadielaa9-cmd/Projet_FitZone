<div class="mb-4">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <label class="form-label fw-bold">Recherche par nom</label>

    <div class="d-flex gap-2">
      <a routerLink="/" class="btn btn-outline-dark">
        <i class="bi bi-house"></i>
        Home
      </a>
<a routerLink="/trash" class="nav-link">
  <i class="bi bi-trash"></i>
  Corbeille
</a>
<a routerLink="/productform" class="btn btn-outline-success">
  <i class="bi bi-plus-circle"></i>
  Ajouter produit
</a>
      <a routerLink="/changepassword" class="btn btn-outline-warning">
        <i class="bi bi-key"></i>
        Changer le mot de passe
      </a>
    </div>
  </div> <!-- ici tu fermes le d-flex -->

  <input
    type="text"
    class="form-control"
    name="searchname"
    placeholder="Enter product name..."
    [ngModel]="searchname()"
    (ngModelChange)="searchname.set($event)"
  >
</div>
@for (p of filtrerproduit(); track p.id) {
  <div class="product-card">

  <div class="product-image">
    <img [src]="p.photo" [alt]="p.nom">
  </div>

  <div class="product-info">
    <span class="product-category">{{ p.categorie }}</span>

    <h3>{{ p.nom }}</h3>

    <p class="product-description">
      {{ p.description }}
    </p>

    <div class="product-bottom">
      <span class="product-price">{{ p.prix }} DT</span>

      <div class="product-actions">
        <button class="btn-edit" (click)="modifierproduit(p)">
          <i class="bi bi-pencil-square"></i>
          Edit
        </button>

        <button class="btn-delete" (click)="onsuprrime(p)">
          <i class="bi bi-trash3"></i>
          Delete
        </button>
      </div>
    </div>
  </div>
    @if (mode()) {
      <form [formRoot]="produitForm" (submit)="onSubmit()">
        <!-- Nom -->
        <div class="mb-3">
          <label class="form-label">Product name</label>
          <input type="text" class="form-control"
            [formField]="produitForm.nom">
        </div>

        <!-- Prix -->
        <div class="mb-3">
          <label class="form-label">Price</label>
          <input type="number" class="form-control"
            [formField]="produitForm.prix">
        </div>

        <!-- Date -->
        <div class="mb-3">
          <label class="form-label">Date added</label>
          <input type="date" class="form-control"
            [formField]="produitForm.dateAjout">
        </div>

        <!-- Photo -->
        <div class="mb-3">
          <label class="form-label">Photo URL</label>
          <input type="text" class="form-control"
            [formField]="produitForm.photo">
        </div>

        <!-- Category -->
        <div class="mb-3">
          <label class="form-label">Category</label>
          <select class="form-select"
            [formField]="produitForm.categorie">
            @for (c of categorie; track $index) {
              <option [value]="c">{{c}}</option>
            }
          </select>
        </div>

        <!-- Description -->
        <div class="mb-3">
          <label class="form-label">Description</label>
          <textarea class="form-control"
            [formField]="produitForm.description"></textarea>
        </div>

        <button type="submit" class="btn btn-orange">
          Save changes
        </button>

        <button type="button" class="btn btn-secondary"
          (click)="mode.set(false)">
          Cancel
        </button>

      </form>
    }
  </div>
}
