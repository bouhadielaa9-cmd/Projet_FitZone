
<div class="login-page">
  <div class="login-card">

    <div class="login-logo">
      FIT<span>ZONE</span>
    </div>

    <p class="login-subtitle">ADMINISTRATOR SPACE</p>

    <h2>Welcome Back!</h2>
    <p class="login-description">
      Login to manage your FitZone store.
    </p>

    <div class="mb-4">
      <label class="form-label">Username</label>
      <div class="input-group">
        <span class="input-group-text">
          <i class="bi bi-person"></i>
        </span>
        <input
          type="text"
          class="form-control"
          placeholder="Enter your email"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
        >
      </div>
    </div>

    <div class="mb-4">
      <label class="form-label">Password</label>
      <div class="input-group">
        <span class="input-group-text">
          <i class="bi bi-lock"></i>
        </span>
        <input
          type="password"
          class="form-control"
          placeholder="Enter your password"
          [ngModel]="mdp()"
          (ngModelChange)="mdp.set($event)"
        >
      </div>
    </div>

    <button
      type="button"
      class="btn btn-orange w-100"
      (click)="verifierlogin()">
      LOGIN <i class="bi bi-arrow-right ms-2"></i>
    </button>

    @if (connect()) {
      <div class="success-message mt-4">
        <i class="bi bi-check-circle-fill"></i>
        Login successful!
      </div>

      <div class="admin-links mt-3">
        <a routerLink="/productmanagement">
          <i class="bi bi-gear me-2"></i>
          Manage Products
        </a>

        <a routerLink="/productform">
          <i class="bi bi-plus-circle me-2"></i>
          Add Product
        </a>
      </div>
    }

  </div>
</div>
