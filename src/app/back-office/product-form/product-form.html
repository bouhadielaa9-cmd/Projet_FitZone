
<div class="container management-container py-5 mt-5">

  <a
    routerLink="/admin/productmanagement"
    class="back-link">
    <i class="bi bi-arrow-left"></i>
    Back to Management
  </a>

  <div class="card product-form-card shadow">

    <div class="form-header">
      <div class="form-header-icon">
        <i class="bi bi-plus-circle"></i>
      </div>

      <div>
        <h3>ADD NEW PRODUCT</h3>
        <p class="mb-0">
          Complete the information to add a product to FitZone.
        </p>
      </div>
    </div>

    <div class="card-body p-4">

      <form [formRoot]="produitForm" (submit)="onSubmit()">

        <div class="form-section-heading">
          <i class="bi bi-info-circle"></i>
          Product information
        </div>

        <div class="row">

          <div class="col-md-6 mb-3">
            <label class="form-label">Product name</label>
            <input
              type="text"
              class="form-control"
              [class.input-filled]="produitForm.nom().value()"
              [formField]="produitForm.nom"
              placeholder="Enter product name">
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Price (DT)</label>
            <input
              type="number"
              class="form-control"
              [class.input-filled]="produitForm.prix().value()"
              [formField]="produitForm.prix"
              placeholder="Enter price">
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Date added</label>
            <input
              type="date"
              class="form-control"
              [class.input-filled]="produitForm.dateAjout().value()"
              [formField]="produitForm.dateAjout">
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Product image URL</label>
            <input
              type="text"
              class="form-control"
              [class.input-filled]="produitForm.photo().value()"
              [formField]="produitForm.photo"
              placeholder="Paste image URL">
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Category</label>
            <select
              class="form-select"
              [class.input-filled]="produitForm.categorie().value()"
              [formField]="produitForm.categorie">

              <option value="">Choose category</option>

              @for(c of categorie; track $index) {
                <option [value]="c">{{ c }}</option>
              }

            </select>
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Description</label>
            <textarea
              class="form-control"
              [class.input-filled]="produitForm.description().value()"
              [formField]="produitForm.description"
              placeholder="Product description"
              rows="2"></textarea>
          </div>

        </div>

        <hr class="form-divider">

        <div class="form-array-section mb-4">

          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="form-section-title">
              <i class="bi bi-rulers"></i>
              Available sizes
            </h5>

            <button
              type="button"
              class="btn-add-field"
              (click)="addsizes()">
              <i class="bi bi-plus-lg"></i>
              Add size
            </button>
          </div>

          @for(t of produitForm.tailles; track $index) {
            <div class="mb-3 dynamic-field">
              <span class="field-number">{{ $index + 1 }}</span>

              <input
                type="text"
                class="form-control"
                [class.input-filled]="t().value()"
                [formField]="t"
                placeholder="Enter size">
            </div>
          }

        </div>

        <hr class="form-divider">
        <div class="form-array-section mb-4">

          
<div class="d-flex justify-content-between align-items-center mb-3">
  <h5 class="form-section-title">
    <i class="bi bi-palette"></i>
    Available colors
  </h5>

  <button
    type="button"
    class="btn-add-field"
    (click)="addcolors()">
    <i class="bi bi-plus-lg"></i>
    Add color
  </button>
</div>
          @for(c of produitForm.couleurs; track $index) {
            <div class="mb-3 dynamic-field">
              <span class="field-number">{{ $index + 1 }}</span>

              <input
                type="text"
                class="form-control"
                [class.input-filled]="c().value()"
                [formField]="c"
                placeholder="Enter color">
            </div>
          }

        </div>
        <div class="form-actions d-flex justify-content-end gap-3 mt-4">

          <button type="reset" class="btn-cancel">
            <i class="bi bi-x-circle me-2"></i>
            Cancel
          </button>

          <button type="submit" class="btn-orange">
            <i class="bi bi-plus-lg me-2"></i>
            Add product
          </button>

        </div>

      </form>

    </div>
  </div>
</div>
