
<div class="password-page">
  <div class="password-card">

    <div class="password-icon">
      <i class="bi bi-shield-lock"></i>
    </div>

    <h2>Change Password</h2>
    <p class="subtitle">Secure your administrator account</p>

    <form (ngSubmit)="changermdp()">

      <div class="mb-3">
        <label class="form-label">Old Password</label>
        <input
          type="password"
          class="form-control"
          placeholder="Enter old password"
          [ngModel]="ancienmdp()"
          (ngModelChange)="ancienmdp.set($event)"
          name="ancienmdp"
          required>
      </div>

      <div class="mb-3">
        <label class="form-label">New Password</label>
        <input
          type="password"
          class="form-control"
          placeholder="Enter new password"
          [ngModel]="nouveaumdp()"
          (ngModelChange)="nouveaumdp.set($event)"
          name="nouveaumdp"
          required>
      </div>

      <div class="mb-4">
        <label class="form-label">Confirm New Password</label>
        <input
          type="password"
          class="form-control"
          placeholder="Confirm new password"
          [ngModel]="confirmation()"
          (ngModelChange)="confirmation.set($event)"
          name="confirmation"
          required>
      </div>

      <button type="submit" class="btn btn-orange w-100">
        <i class="bi bi-check2-circle me-2"></i>
        Change Password
      </button>

    </form>

    @if (message()) {
      <p class="message mt-3">{{ message() }}</p>
    }

    <a routerLink="/productmanagement" class="back-link">
      <i class="bi bi-arrow-left me-2"></i>
      Back to Management
    </a>

  </div>
</div>
