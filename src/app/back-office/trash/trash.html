
<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Corbeille</h2>

    <a routerLink="/productmanagement" class="btn btn-dark">
      Retour
    </a>
  </div>

  @if (produitsSupprimes().length === 0) {
    <div class="alert alert-info">
      La corbeille est vide.
    </div>
  }

  <div class="row">
    @for (p of produitsSupprimes(); track p.id) {
      <div class="col-md-4 mb-3">
        <div class="card h-100">
          <img [src]="p.photo" class="card-img-top" alt="Produit">

          <div class="card-body">
            <h5 class="card-title">{{ p.nom }}</h5>
            <p class="card-text">{{ p.prix }} DT</p>

            <button class="btn btn-success me-2"
              (click)="restaurer(p)">
              Restaurer
            </button>

            <button class="btn btn-danger"
              (click)="supprimerDefinitivement(p)">
              Supprimer définitivement
            </button>
          </div>
        </div>
      </div>
    }
  </div>
</div>
